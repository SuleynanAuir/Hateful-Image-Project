name: hateful-image-ofa
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy
  - pandas
  - matplotlib
  - pillow
  - tqdm
  - psutil
  - cython
  - pytorch::pytorch=1.12.0
  - pytorch::torchvision=0.13.0
  - pytorch::torchaudio=0.12.0
  
  - pip:
    # Fairseq构建依赖
    - hydra-core>=1.0.0
    - omegaconf>=2.0.0
    - sacrebleu>=2.0.0
    # 注意：fairseq需要从GitHub安装，建议在环境激活后手动安装
    # pip install git+https://github.com/pytorch/fairseq.git
    # 或者特定版本：
    # pip install fairseq==0.12.2
